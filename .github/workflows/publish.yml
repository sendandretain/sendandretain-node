name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC, no NPM_TOKEN) needs npm >= 11.5.1. Node 22
      # bundles npm 10, which falls back to token auth and fails with ENEEDAUTH.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm test

      - name: Tag must match package version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      # `prepublishOnly` regenerates from openapi.json and rebuilds, so a
      # stale dist/ cannot ship. --provenance signs the release back to this
      # workflow; npm shows it on the package page. It REQUIRES a public repo —
      # on a private one npm refuses the publish.
      #
      # npm has no "pending" trusted publisher: the package must exist before
      # one can be attached, so the very first version is published by hand.
      - name: Publish
        run: npm publish --provenance --access public
